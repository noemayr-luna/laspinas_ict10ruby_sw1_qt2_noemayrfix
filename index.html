<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght @400;600&display=swap" rel="stylesheet">
    <title>Treasure hunt club</title>
 <style>
        body {
            font-family: sans-serif, serif;
            background-color: #19d1d7;
            color: #d6e1fd;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #2197b8;
            color: #d1daf5;
            padding: 25px;
            border-bottom: 2px solid #6c3aea;
        }

        header h1 {
            font-family: sans-serif;
            font-size: 32px;
            letter-spacing: 2px;
            color: #fb862c;
        }

        header p {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
        }

        main {
            background-color: #f8b85e;
            color: #0691a0;
            width: 300px;
            max-width: calc(100% - 70px);
            margin: 40px auto;
            padding: 25px;
            border-radius: 3px;
            border-top: 5px solid #6dc4c6;
        }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            background-color: #FFFDF7;
            color: #1bc5b4;
            font-family: Georgia, serif;
            font-size: 14px;
            border: 1px solid #C6A76D;
            border-radius: 3px;
            outline: none;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border: 2px solid #172B4D;
        }

        input[type="text"]::placeholder {
            color: #888273;
            font-style: italic;
        }

        input[type="button"] {
            background-color: #1ffffb;
            color: #154752;
            padding: 12px 30px;
            margin-top: 12px;
            font-family: Georgia, serif;
            font-size: 13px;
            letter-spacing: 2px;
            border: 1px solid #172B4D;
            border-radius: 3px;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #C6A76D;
            color: #172B4D;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #E9DFC9;
            color: #172B4D;
            font-family: Georgia, serif;
            font-size: 16px;
            line-height: 1.5;
            border-left: 3px solid #C6A76D;
            overflow-wrap: anywhere;
        }

        footer {
            background-color: #f6cd64;
            color: #F5EBDD;
            padding: 18px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
        }

        footer span {
            color: #C6A76D;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Treasure Hunt Club</h1>
        <p>A club where you can enjoy puzzles and find treasure!</p>
    </header>

    <main>
        <h2>Candidate Verification System</h2>
        <p>Enter your name to check if you actually belong here and ARENT a normie.</p>

        <form onsubmit="return false;">
            <input
                type="text"
                id="first_name"
                placeholder="Enter your First Name"
                required
            >
            <br>

            <input
                type="text"
                id="last_name"
                placeholder="Enter your Last Name"
                required
            >
            <br>

            <input
                type="button"
                py-click="candidate_checker"
                value="Enter"
            >
        </form>

        <div id="result"></div>
    </main>

    <footer>
        &copy; 2026 <span>Treasure Hunt Club</span>
        &bull;Verification System
    </footer>

    </main>
    <py-script src="main.py"></py-script>    
</body>
</html>
